name: Magpie AI brain

on:
  push:
    paths:
      - 'brain/**'
      - '.github/workflows/brain.yml'
  pull_request:
    paths:
      - 'brain/**'
      - '.github/workflows/brain.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: brain/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q -p no:warnings
