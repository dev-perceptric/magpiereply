# Build the app image (web and Sidekiq), the agent image, the brain image and the reader image on every push and publish them to
# GitHub's container registry (ghcr.io). The Hostinger VPS pulls these images. GITHUB_TOKEN is the only secret it needs.
# Only the main branch moves the `latest` tag, which the VPS runs; other branches publish commit tags only.
name: Build images

on:
  push:
    branches: [claude/brave-mayer-66phgz, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: magpiereply
            context: .
            file: docker/Dockerfile
          - image: magpie-agent
            context: agent
            file: agent/Dockerfile
          - image: magpie-brain
            context: brain
            file: brain/Dockerfile
          - image: magpie-reader
            context: brain
            file: brain/Dockerfile.reader
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/claude/brave-mayer-66phgz' && format('ghcr.io/{0}/{1}:latest', github.repository_owner, matrix.image) || '' }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
