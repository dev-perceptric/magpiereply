# Golden tests for the Magpie AI brain: the 40 trial conversations against a real brain on Claude (Stripe from the
# fixture), then Ragas faithfulness on every reply that cites help articles. Runs on pull requests that touch brain/.
# Needs the ANTHROPIC_API_KEY and VOYAGE_API_KEY repository secrets; without them it says so and stops. About $0.25 a run.
name: Magpie AI golden tests

on:
  pull_request:
    paths:
      - 'brain/**'
      - '.github/workflows/brain-golden.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brain-golden-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      BRAIN_API_KEY: ci-golden-brain-key-0123456789
      STRIPE_MODE: fixture
      DATA_DIR: ${{ github.workspace }}/brain-data
      RERANK_CACHE: ${{ github.workspace }}/flashrank
    defaults:
      run:
        working-directory: brain
    steps:
      - name: Check for the keys
        id: keys
        working-directory: .
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] && [ -n "$VOYAGE_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Golden tests need the ANTHROPIC_API_KEY and VOYAGE_API_KEY repository secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.keys.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.keys.outputs.ready == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: brain/requirements*.txt
      - name: Install
        if: steps.keys.outputs.ready == 'true'
        run: pip install -r requirements.txt -r requirements-golden.txt
      - name: Start the brain
        if: steps.keys.outputs.ready == 'true'
        run: |
          mkdir -p "$DATA_DIR"
          nohup python -m magpie_brain.main > "$RUNNER_TEMP/brain.log" 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8800/healthz && exit 0; sleep 2; done
          cat "$RUNNER_TEMP/brain.log"; exit 1
      - name: The 40 trial conversations
        if: steps.keys.outputs.ready == 'true'
        run: python -m trial.run_trial --strict
      - name: Ragas faithfulness
        if: steps.keys.outputs.ready == 'true'
        run: python -m trial.score_ragas --min 0.75
      - name: Brain log
        if: failure() && steps.keys.outputs.ready == 'true'
        run: tail -100 "$RUNNER_TEMP/brain.log"
