# magpie-brain: the Parlant server for the trial, on Fly.io (Tokyo). See brain/README.md.
# Deploy from the repo root: fly deploy --config brain/fly.toml --dockerfile brain/Dockerfile .
# Secrets: ANTHROPIC_API_KEY, VOYAGE_API_KEY, PARLANT_ADMIN_API_KEY, GATEWAY_MCP_URL, GATEWAY_TOKEN.
app = 'magpie-brain'
primary_region = 'nrt'

[env]
  PORT = '8800'
  PARLANT_ENV = 'production'
  PARLANT_HOME = '/data'

[mounts]
  source = 'brain_data'
  destination = '/data'

[http_service]
  internal_port = 8800
  force_https = true
  # Always on, so trial timings don't include a cold start.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
