# Magpie MCP gateway (ContextForge) on Fly.io (Tokyo). See gateway/README.md.
# Deploy from this folder: fly deploy
# Secrets: DATABASE_URL, JWT_SECRET_KEY, AUTH_ENCRYPTION_SECRET, PLATFORM_ADMIN_EMAIL,
# PLATFORM_ADMIN_PASSWORD, DEFAULT_USER_PASSWORD and BASIC_AUTH_PASSWORD.
app = 'magpie-gateway'
primary_region = 'nrt'

[build]
  image = 'ghcr.io/ibm/mcp-context-forge:v1.1.0'

[env]
  HOST = '0.0.0.0'
  PORT = '4444'
  APP_DOMAIN = 'https://magpie-gateway.fly.dev'
  ENVIRONMENT = 'production'
  SECURE_COOKIES = 'true'
  GUNICORN_WORKERS = '2'
  CACHE_TYPE = 'database'
  # Shares Supabase with the app and the agent: at most 2 workers x (3 + 2) = 10 connections.
  DB_POOL_SIZE = '3'
  DB_MAX_OVERFLOW = '2'
  MCPGATEWAY_UI_ENABLED = 'true'
  MCPGATEWAY_ADMIN_API_ENABLED = 'true'
  PLATFORM_ADMIN_FULL_NAME = 'MagpieReply admin'
  # Stripe's MCP sign-in registers its own client (public client with PKCE, scope "mcp").
  DCR_ENABLED = 'true'
  DCR_TOKEN_ENDPOINT_AUTH_METHOD = 'none'
  DCR_DEFAULT_SCOPES = '["mcp"]'
  DCR_ALLOWED_ISSUERS = '["https://access.stripe.com/mcp"]'

[http_service]
  internal_port = 4444
  force_https = true
  # Always on, so trial timings don't include a cold start.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '60s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

# 1 GB ran out of memory: each worker starts helper processes of about 240 MB.
[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
