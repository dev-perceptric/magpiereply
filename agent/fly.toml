# Magpie AI agent service on Fly.io (Tokyo). Deploy from this folder: fly deploy
# Secrets: DATABASE_URL (Supabase session pooler, port 5432) and ENCRYPTION_KEY (openssl rand -base64 32).
app = 'magpie-agent'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'node dist/migrate.js'

[env]
  PORT = '8080'
  # The app's Fly address, so the agent never waits on the public domain's DNS.
  APP_URL = 'https://magpiereply-web.fly.dev'
  PUBLIC_URL = 'https://magpie-agent.fly.dev'
  TURN_DELAY_SECONDS = '4'

[processes]
  api = 'node dist/api.js'
  worker = 'node dist/worker.js'

[http_service]
  internal_port = 8080
  processes = ['api']
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  processes = ['api', 'worker']
