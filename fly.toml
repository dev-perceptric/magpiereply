# MagpieReply web app on Fly.io (Tokyo). See docs/fly.md.
app = 'magpiereply-web'
primary_region = 'nrt'

[build]
  dockerfile = 'docker/Dockerfile'

[deploy]
  # Loads the schema on the first deploy and runs migrations after that.
  release_command = 'bundle exec rails db:chatwoot_prepare'

[env]
  RAILS_ENV = 'production'
  NODE_ENV = 'production'
  RAILS_LOG_TO_STDOUT = 'true'
  # Don't send usage counts to Chatwoot's hub.
  DISABLE_TELEMETRY = 'true'
  FRONTEND_URL = 'https://app.magpiereply.com'
  ACTIVE_STORAGE_SERVICE = 's3_compatible'
  STORAGE_FORCE_PATH_STYLE = 'true'
  RAILS_MAX_THREADS = '5'

[experimental]
  entrypoint = ['docker/entrypoints/rails.sh']
  cmd = ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '90s'
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/api'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
